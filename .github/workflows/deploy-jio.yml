name: Deploy Blaubeere

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      access_only:
        description: Update company access on the current production release without redeploying
        type: boolean
        default: false
      grant_email:
        description: Existing account to grant company access (optional)
        type: string
        required: false
      grant_companies:
        description: Comma-separated imported company IDs (optional)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: blaubeere-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            !/reports/
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Check deployment scripts
        run: |
          bash -n deploy/jio.sh deploy/runtime.sh
          bun scripts/check-deploy.ts
      - name: Install Jio
        run: |
          curl -fsSL https://github.com/jiovannish/client/releases/download/v0.3.1/install.sh -o "$RUNNER_TEMP/install-jio.sh"
          JIO_INSTALL_DIR="$RUNNER_TEMP/bin" sh "$RUNNER_TEMP/install-jio.sh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Prepare Jio session
        env:
          JIO_STATE_DIR: ${{ runner.temp }}/jio
          JIO_API_KEY: ${{ secrets.JIO_API_KEY }}
          JIO_SSH_KEY: ${{ secrets.JIO_SSH_KEY }}
          JIO_ENDPOINT: ${{ vars.JIO_ENDPOINT }}
          JIO_VM_ID: ${{ vars.JIO_VM_ID }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ -n "$JIO_API_KEY" && -n "$JIO_SSH_KEY" && "$JIO_VM_ID" =~ ^[0-9a-f]{32}$ ]] || { echo 'Configure JIO_API_KEY, JIO_SSH_KEY and JIO_VM_ID'; exit 1; }
          [[ -n "$JIO_ENDPOINT" ]] || unset JIO_ENDPOINT
          session="$JIO_STATE_DIR/sessions/$JIO_VM_ID"
          install -d -m 700 "$JIO_STATE_DIR" "$JIO_STATE_DIR/sessions" "$session"
          printf '%s\n' "$JIO_SSH_KEY" > "$session/id_ed25519"
          ssh-keygen -y -f "$session/id_ed25519" > "$session/id_ed25519.pub"
          printf 'medium\n' > "$session/requested-size"
          # Jio pins the current host key through its authenticated API.
          unset JIO_SSH_KEY
          [[ "$(jio usage)" == "Account: blaubeere ("* ]] || { echo 'Production access requires the blaubeere Jio account' >&2; exit 1; }
      - name: Deploy and verify production
        id: deploy
        if: ${{ !inputs.access_only }}
        env:
          JIO_STATE_DIR: ${{ runner.temp }}/jio
          JIO_API_KEY: ${{ secrets.JIO_API_KEY }}
          JIO_ENDPOINT: ${{ vars.JIO_ENDPOINT }}
          JIO_VM_ID: ${{ vars.JIO_VM_ID }}
          GIT_REF: ${{ github.sha }}
        run: |
          [[ -n "$JIO_ENDPOINT" ]] || unset JIO_ENDPOINT
          bash deploy/jio.sh
      - name: Grant requested company access
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.grant_email != '' }}
        env:
          JIO_STATE_DIR: ${{ runner.temp }}/jio
          JIO_API_KEY: ${{ secrets.JIO_API_KEY }}
          JIO_ENDPOINT: ${{ vars.JIO_ENDPOINT }}
          JIO_VM_ID: ${{ vars.JIO_VM_ID }}
          GRANT_EMAIL: ${{ inputs.grant_email }}
          GRANT_COMPANIES: ${{ inputs.grant_companies }}
        run: |
          [[ -n "$JIO_ENDPOINT" ]] || unset JIO_ENDPOINT
          python3 - <<'PY'
          import os, re, shlex, subprocess
          email, companies = os.environ['GRANT_EMAIL'], os.environ['GRANT_COMPANIES'].split(',')
          assert re.fullmatch(r'[A-Za-z0-9._+%-]+@[A-Za-z0-9.-]+', email), 'Invalid email'
          assert 1 <= len(companies) <= 20 and all(re.fullmatch(r'COMP_[0-9]{4}', c) for c in companies), 'Invalid company IDs'
          command = 'set -ae; cd /var/lib/blaubeere/data; . /var/lib/blaubeere/runtime.env; exec /var/lib/blaubeere/current/bin/blaubeere-api grant-company-access ' + shlex.join([email, *companies])
          subprocess.run(['jio', 'exec', os.environ['JIO_VM_ID'], 'sudo -n -u blaubeere bash -c ' + shlex.quote(command), '--timeout', '30'], check=True)
          PY
      - name: Landing URL
        if: ${{ success() && steps.deploy.outputs.landing_url != '' }}
        env:
          LANDING_URL: ${{ steps.deploy.outputs.landing_url }}
        run: printf '%s\n' "$LANDING_URL" | tee -a "$GITHUB_STEP_SUMMARY"
